{% extends 'base.html' %}
{% load static %}

{% block title %}My Products{% endblock %}

{% block content %}
<div class="container-fluid py-4">

  <!-- ============================== Header ============================== -->
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <h1 class="h3 mb-0">My Products</h1>
    <a href="{% url 'seller_product_add' %}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i> Add Product
    </a>
  </div>

  <!-- ============================== Search ============================== -->
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <form id="productSearchForm" method="get" action="/seller/products/" class="row g-2 align-items-center">
          <div class="col-md-6 col-lg-4">
              <div class="input-group">
                  <span class="input-group-text bg-white">
                      <i class="bi bi-search"></i>
                  </span>
                  <input id="searchInput"type="search" name="q" class="form-control"placeholder="Search products…">
              </div>
          </div>
          <div class="col-auto">
              <button type="submit" class="btn btn-outline-secondary">
                  Search
              </button>
          </div>
      </form>
    </div>
  </div>

  <!-- ============================== Products table ============================== -->
  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Image</th>
              <th>Product Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Discount Price</th>
              <th>Stock</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead> 
          <tbody id="productTableBody">
            <!-- Populated by static/js/seller/products.js (loadProducts) -->
            <tr>
              <td colspan="8" class="text-center text-muted py-4">
                <span class="spinner-border spinner-border-sm me-2"></span>Loading products…
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ============================== Pagination ============================== -->
  <!-- Rendered by products.js from the API's count/next/previous fields. -->
  <div class="mt-4" id="productPagination"></div>

</div>

<script src="{% static 'js/seller/products.js' %}"></script>
{% endblock %}
