{% extends 'base.html' %}
{% load static %}

{% block title %}Login — ShopFlow{% endblock %}

{% block content %}
<section class="auth-section py-5">
  <div class="container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <h1 class="section-title mb-1" style="font-size:1.6rem;">Welcome back</h1>
        <p class="text-muted-custom mb-0">Log in to continue shopping.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" autocomplete="email" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" autocomplete="current-password" required>
            <button class="btn btn-outline-brand" type="button" id="togglePassword" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label small" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="small">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-brand w-100">Log In</button>
      </form>

      <p class="text-center small text-muted-custom mt-4 mb-0">
        Don't have an account? <a href="/accounts/register/">Sign up</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/auth.js' %}"></script>
<script>
  document.getElementById("toggleLoginPassword")?.addEventListener("click", function () {
    const input = document.getElementById("loginPassword");
    const icon = this.querySelector("i");
    const isHidden = input.type === "password";
    input.type = isHidden ? "text" : "password";
    icon.className = isHidden ? "bi bi-eye-slash" : "bi bi-eye";
  });
</script>
{% endblock %}
