{% extends 'base.html' %}
{% load static %}

{% block title %}Create an Account — ShopFlow{% endblock %}

{% block content %}
<section class="auth-section py-5">
  <div class="container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <h1 class="section-title mb-1" style="font-size:1.6rem;">Create your account</h1>
        <p class="text-muted-custom mb-0">Join ShopFlow and start shopping.</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="registerUsername">Username</label>
          <input type="text" class="form-control" id="registerUsername" autocomplete="username" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="registerEmail">Email</label>
          <input type="email" class="form-control" id="registerEmail" autocomplete="email" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="registerPassword">Password</label>
          <input type="password" class="form-control" id="registerPassword" autocomplete="new-password" required minlength="8">
          <div class="form-text">At least 8 characters.</div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="registerPassword2">Confirm Password</label>
          <input type="password" class="form-control" id="registerPassword2" autocomplete="new-password" required minlength="8">
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="agreeTerms" required>
          <label class="form-check-label small" for="agreeTerms">
            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="btn btn-brand w-100">Create Account</button>
      </form>

      <p class="text-center small text-muted-custom mt-4 mb-0">
        Already have an account? <a href="{% url 'login' %}">Log in</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
